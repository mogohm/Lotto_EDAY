include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.47+ deprecates package:flutter/material.dart in favour of the
    # separately versioned package:material_ui. go_router and other deps still
    # use flutter/material, and mixing both copies breaks Theme/Localizations
    # lookups, so we intentionally stay on flutter/material for now.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - web/**
