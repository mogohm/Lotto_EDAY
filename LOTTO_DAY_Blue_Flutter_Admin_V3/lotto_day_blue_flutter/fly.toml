# Fly.io deployment: one app (API + Flutter web) + Fly Postgres attached via DATABASE_URL secret.
app = "lotto-eday-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  WEB_DIR = "/app/public"
  RATE_LIMIT_PER_MINUTE = "300"
  AUTH_RATE_LIMIT = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
