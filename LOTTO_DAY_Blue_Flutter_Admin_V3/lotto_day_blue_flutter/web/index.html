<!DOCTYPE html>
<html lang="th">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LOTTO DAY — ระบบสาธิตตรวจผลหวย 4 ประเภทและร้านสลากจำลอง (ไม่มีการชำระเงินจริง)">
  <meta name="theme-color" content="#0078D7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LOTTO DAY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>LOTTO DAY • DEMO</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4FAFF; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #0078D7 0%, #00AEEF 55%, #E8F6FF 100%); font-family: system-ui, "Noto Sans Thai", sans-serif; }
    #splash .logo { font-size: 34px; font-weight: 900; color: #fff; letter-spacing: 1px; }
    #splash .logo span { color: #FFC700; }
    #splash .sub { margin-top: 10px; color: #fff; opacity: .9; font-size: 14px; }
    #splash .bar { margin-top: 22px; width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.35); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #FFC700; animation: load 1.1s infinite ease-in-out; }
    @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash"><div class="logo">🎟 LOTTO <span>DAY</span></div><div class="sub">กำลังโหลด… • ระบบสาธิต</div><div class="bar"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () { var s = document.getElementById('splash'); if (s) s.remove(); });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
